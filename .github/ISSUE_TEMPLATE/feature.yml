name: Feature request
description: A browser to support, a kind of rule, or anything else.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The links you want routed and where, or the problem you hit.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Ideas for how
