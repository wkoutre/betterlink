name: tour
# The tour (docs/tour.md) is betterlink's first-run flow and its What's New.
# It only stays true if every change that ships is weighed against it, so a
# pull request that changes the app, the command or the Tabs extension must
# either change Tour/tour.json or say on a "Tour:" line in its description why
# the tour stays as it is. Also checked: a step's revision only goes up, and a
# removed step's id is retired (scripts/check-tour-pr.py has the rules).
#
# What can be read from the code alone (every page, command, setting and
# permission has a step) is `make test`'s job, in test.yml.
on:
  pull_request:
    # edited: the description is part of what is checked.
    types: [opened, edited, synchronize, reopened]
permissions: {}
concurrency:
  group: tour-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the PR's files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the PR against the tour
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/files"
          # The tour as it is on the base, to compare revisions with. A base
          # from before the tour has none.
          gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/Tour/tour.json?ref=$BASE" > "$RUNNER_TEMP/base-tour.json" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/base-tour.json"
          python3 scripts/check-tour-pr.py --files "$RUNNER_TEMP/files" --base "$RUNNER_TEMP/base-tour.json"
