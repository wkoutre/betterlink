name: test
on:
  # Main is tested again only for merges the release workflow skips (its
  # paths-ignore). Every other merge runs release.yml, whose own test job runs
  # make test + make test-cli on main before anything ships, so a second
  # macOS run here would test the same commit twice.
  push:
    branches: ["main"]
    paths:
      - "Tests/**"
      - "cli/test/**"
      - ".github/workflows/test.yml"
  pull_request:
permissions: {}
# A newer push to the same PR replaces the run in progress.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # macOS minutes cost ten times Linux ones, so a PR that changes nothing
  # swift-test exercises (docs, other workflows, setup helpers) skips it.
  # A job skipped by its `if` reports success, so the required swift-test
  # check still passes and the PR can merge. Anything not on the list below
  # runs the tests, so a new kind of file is tested by default.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # list the PR's files
    outputs:
      swift: ${{ steps.files.outputs.swift }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')
          tested=$(grep -vE '\.md$|^LICENSE$|^docs/|^\.github/(CODEOWNERS|dependabot\.yml|workflows/(release|zizmor)\.yml)$|^scripts/set-(release-secrets|version)\.sh$' <<< "$files" || true)
          if [ -n "$tested" ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Only docs, other workflows or setup helpers changed; swift-test is skipped (reports success)."
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  swift-test:
    needs: changes
    # Runs unless changes said "false": if changes itself failed, test anyway
    # rather than let a skipped check pass.
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: ./scripts/check-bun.sh # the same check the release jobs make
      - run: swift --version
      - run: make test
      - run: make test-cli
      - run: make test-tabs
      - run: ./scripts/check-idle.sh # against the app test-cli built
      # Package.resolved pins Sparkle to a commit. A build that had to change
      # it means the committed pins are stale: run `swift package resolve`
      # and commit the result.
      - run: git diff --exit-code -- Package.resolved

  # Dependabot intake. Runs only on Dependabot's own PRs, after swift-test
  # passed. It waits for every other check on the PR (zizmor, outside apps),
  # then squash-merges the bump if the policy below allows it, or leaves one
  # comment saying why a person has to look.
  #
  # Policy (one place; .github/dependabot.yml says what gets proposed):
  #   GitHub's own actions (actions/*, github/*)  patch and minor
  #   cli/ dev dependencies                       patch and minor
  #   cli/ dependencies bundled in the app        patch only
  #   Sparkle (swift), other actions, majors      never: a person reviews them
  # Sparkle installs every update betterlink ships, and a third-party action
  # can run in the jobs that hold the signing keys, so neither merges itself.
  #
  # The merge is made with this run's token. A push made with GITHUB_TOKEN
  # starts no workflow, so it never starts a release: the bump ships with the
  # next release a person merges, which retests it on main first.
  dependabot:
    needs: swift-test
    # swift-test is skipped when a bump touches only other workflows.
    if: >-
      !cancelled() &&
      (needs.swift-test.result == 'success' || needs.swift-test.result == 'skipped') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # squash-merge (fallback when the release bot isn't set up)
      pull-requests: write # comment when a person has to look
      checks: read # wait for the other checks
    env:
      # Dependabot's runs read Dependabot secrets, not Actions secrets.
      BOT_CLIENT_ID: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
    steps:
      # The merge needs the release bot: it is the only non-person the
      # "main: review" ruleset lets merge without an approval. Falls back to
      # GITHUB_TOKEN until the bot's secrets exist.
      - name: Release bot token
        id: bot
        if: env.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ env.BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write # GitHub Actions bumps edit workflow files

      - name: Check the bump, wait for the other checks, merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Only Dependabot's own single, signed commit. Anything else pushed
          # to its branch makes this a normal PR that a person merges.
          commits=$(gh api "repos/$GH_REPO/pulls/$PR/commits" --jq 'length')
          author=$(gh api "repos/$GH_REPO/commits/$SHA" --jq '.author.login // ""')
          verified=$(gh api "repos/$GH_REPO/commits/$SHA" --jq '.commit.verification.verified')
          if [ "$commits" != 1 ] || [ "$author" != "dependabot[bot]" ] || [ "$verified" != true ]; then
            echo "::notice::Not a plain Dependabot commit ($commits commits, author $author, verified $verified); leaving it."
            exit 0
          fi

          # The commit message carries Dependabot's metadata block:
          #   - dependency-name: X / dependency-type: direct:development / update-type: version-update:semver-minor
          deps=$(gh api "repos/$GH_REPO/commits/$SHA" --jq '.commit.message' | awk '
            /^- dependency-name:/ { if (n != "") print n "\t" t "\t" u; n = $3; t = ""; u = "" }
            /^  dependency-type:/ { t = $2 }
            /^  update-type:/     { u = $2 }
            END { if (n != "") print n "\t" t "\t" u }' | tr -d '"')
          if [ -z "$deps" ]; then
            echo "::notice::No Dependabot metadata in the commit message; leaving it."
            exit 0
          fi
          ecosystem=$(cut -d/ -f2 <<< "$BRANCH")

          refuse=""
          while IFS=$'\t' read -r name type update; do
            case "$update" in
              version-update:semver-patch) level=patch ;;
              version-update:semver-minor) level=minor ;;
              *) refuse="$name: ${update:-unknown update type} (majors need a person)"; break ;;
            esac
            case "$ecosystem" in
              github_actions)
                case "$name" in
                  actions/*|github/*) ;;
                  *) refuse="$name: only GitHub's own actions merge themselves"; break ;;
                esac ;;
              bun)
                if [ "$type" != direct:development ] && [ "$level" != patch ]; then
                  refuse="$name: ships inside the app ($type), so only patch updates merge themselves"; break
                fi ;;
              swift)
                refuse="$name: Sparkle installs betterlink's updates, so a person reviews it"; break ;;
              *)
                refuse="$name: no policy for $ecosystem"; break ;;
            esac
          done <<< "$deps"

          if [ -n "$refuse" ]; then
            echo "::notice::Needs a person: $refuse"
            marker='<!-- dependabot-intake -->'
            if ! gh api "repos/$GH_REPO/issues/$PR/comments" --jq '.[].body' | grep -qF "$marker"; then
              gh pr comment "$PR" --body "$marker
          This update won't merge itself: $refuse. The policy is the \`dependabot\` job in \`.github/workflows/test.yml\`."
            fi
            exit 0
          fi

          # Tests passed (this job needs them). Wait for every other check on
          # the commit, then require each to have passed.
          for _ in $(seq 1 60); do
            runs=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "dependabot") | {name, status, conclusion}]')
            [ "$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")" = 0 ] && break
            sleep 15
          done
          failed=$(jq -r '[.[] | select(.status != "completed" or (.conclusion as $c | ["success", "skipped", "neutral"] | index($c) | not)) | .name] | join(", ")' <<< "$runs")
          if [ -n "$failed" ]; then
            echo "::warning::Not merging: these checks did not pass: $failed"
            exit 0
          fi

          # --match-head-commit: refuse if anything was pushed since the checks ran.
          # [skip ci]: like a GITHUB_TOKEN merge, this starts no workflow on main,
          # so a dependency bump never cuts a release on its own.
          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR" --squash --match-head-commit "$SHA" \
            --body "Merged by the dependabot job in .github/workflows/test.yml. [skip ci]"
          echo "::notice::Merged #$PR ($(tr '\t' ' ' <<< "$deps" | paste -sd ';' -))."
