name: test
on:
  push:
    branches: ["main"]
  pull_request:
permissions: {}
# A newer push to the same PR replaces the run in progress.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  swift-test:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: ./scripts/check-bun.sh # the same check the release jobs make
      - run: swift --version
      - run: make test
      - run: make test-cli
      # Package.resolved pins Sparkle to a commit. A build that had to change
      # it means the committed pins are stale: run `swift package resolve`
      # and commit the result.
      - run: git diff --exit-code -- Package.resolved
