name: release
# A version tag (v0.3.0) builds, signs, notarizes and staples betterlink.app,
# then opens a DRAFT GitHub Release with the zip, SHA256SUMS, the Homebrew
# cask and the Sparkle feed (appcast.xml). Publishing the draft is a manual
# step, and it is what makes installed copies offer the update.
#
# Run it by hand (workflow_dispatch) for a dry run: it builds and zips
# unsigned, never sees the signing secrets, and publishes nothing.
#
# The signing secrets live in the "release" environment, which should allow
# only v* tags (Settings › Environments › release › Deployment branches and
# tags), so no branch can run code with the Developer ID.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true # a release build must not restore a cache others can write
      - run: make test
      - run: make test-cli
      - run: ./scripts/release.sh
      - name: Summary
        run: |
          {
            echo '### Dry run: unsigned, nothing published'
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true # a release build must not restore a cache others can write

      - name: Check the tag matches Info.plist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match Info.plist version $version." >&2
            exit 1
          fi

      - run: make test
      - run: make test-cli

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          UPDATE_KEY: ${{ secrets.SPARKLE_UPDATE_KEY }}
        run: |
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$NOTARY_KEY_P8" ] || [ -z "$UPDATE_KEY" ]; then
            echo "The release environment is missing MACOS_CERTIFICATE_P12, NOTARY_KEY_P8 or SPARKLE_UPDATE_KEY." >&2
            exit 1
          fi
          (umask 077 && printf '%s' "$UPDATE_KEY" > "$RUNNER_TEMP/update.key")
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarize
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          REQUIRE_SIGNING: "1"
        run: NOTARY_KEY="$RUNNER_TEMP/notary.p8" UPDATE_KEY="$RUNNER_TEMP/update.key" ./scripts/release.sh

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/update.key"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true

      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          files="dist/betterlink-$version.zip dist/betterlink-macos.zip dist/SHA256SUMS dist/betterlink.rb dist/appcast.xml"
          # A re-run after the draft exists replaces its files instead of failing.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $files
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "betterlink $version" --generate-notes $files
          fi
